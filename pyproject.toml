[project]
name = "inkgauge"
version = "1.0.0"
description = "A copyeditor's proof sheet readability and hardest sentence diagnostic"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "jinja2>=3.1.3",
    "python-multipart>=0.0.9",
    "cmudict>=1.0.16",
    "pysbd>=0.3.4",
    "anthropic>=0.18.0",
    "httpx>=0.27.0",
]

[tool.uv]
package = false

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["api*", "tests*"]
